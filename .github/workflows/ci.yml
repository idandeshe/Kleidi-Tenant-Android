name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Unit tests, lint and builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
      - name: Unit tests (core, api, app)
        run: ./gradlew test --console=plain
      - name: Lint
        run: ./gradlew :app:lintDevDebug --console=plain
      - name: Build dev debug + prod release (unsigned)
        run: ./gradlew :app:assembleDevDebug :app:assembleProdRelease --console=plain
